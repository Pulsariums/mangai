# Manga/Manhwa Çeviri Pipeline - Konfigürasyon Dosyası

# OCR Ayarları
ocr:
  provider: "paddleocr"  # paddleocr veya manga-ocr
  lang: "en"  # en, ja, ko
  use_angle_cls: true
  det_db_thresh: 0.3
  det_db_box_thresh: 0.5
  det_db_unclip_ratio: 1.6

# Geometri Ayarları
geometry:
  min_text_area: 50  # Piksel cinsinden minimum metin alanı
  merge_line_distance: 10  # Satırları birleştirme mesafesi (piksel)
  merge_block_distance: 20  # Blokları birleştirme mesafesi (piksel)
  
# Görsel İşleme
image:
  max_width: 2000  # Performans için maksimum genişlik
  max_height: 3000  # Performans için maksimum yükseklik
  
# Debug ve Çıktı
output:
  debug_dir: "./output/debug"
  results_dir: "./output/results"
  save_masks: true
  save_polygons: true
  draw_min_area_rect: true
  rect_color: [255, 0, 0]  # Kırmızı (BGR)
  rect_thickness: 2

# API Ayarları (Faz 2 için hazır)
api:
  provider: "gemini"
  model: "gemini-2.5-flash-lite-preview-06-17"
  keys: []  # API key'leri buraya
  rotation_enabled: true
  rate_limit_delay: 1.0  # Saniye cinsinden
  max_retries: 3

# Cache ve Database
cache:
  enabled: true
  db_path: "./data/translation_cache.db"
  glossary_path: "./data/glossary.json"
