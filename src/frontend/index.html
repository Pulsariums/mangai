<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1>Manga Translator</h1>
            </div>
            <button id="themeToggle" class="icon-btn" title="Toggle theme">
                <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <div class="upload-section">
                    <div class="upload-area" id="dropZone">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p>Drop images here</p>
                        <span>or click to browse</span>
                        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Settings</h3>
                    
                    <div class="setting-item">
                        <label for="sourceLang">Source Language</label>
                        <select id="sourceLang" class="styled-select">
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label for="targetLang">Target Language</label>
                        <select id="targetLang" class="styled-select">
                            <option value="en">English</option>
                            <option value="tr">Turkish</option>
                            <option value="es">Spanish</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label>Auto Inpainting</label>
                        <label class="switch">
                            <input type="checkbox" id="autoInpaint" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-item">
                        <label>Preserve Style</label>
                        <label class="switch">
                            <input type="checkbox" id="preserveStyle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-item">
                        <label for="apiKey">Gemini API Key</label>
                        <input type="password" id="apiKey" class="styled-input" placeholder="Enter API key">
                    </div>
                </div>

                <div class="actions-section">
                    <button id="processBtn" class="btn btn-primary" disabled>
                        Process Images
                    </button>
                    <button id="exportBtn" class="btn btn-secondary" disabled>
                        Export Results
                    </button>
                </div>
            </aside>

            <div class="workspace">
                <div class="image-grid" id="imageGrid"></div>
                
                <div class="empty-state" id="emptyState">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <h2>No images loaded</h2>
                    <p>Upload manga/manhwa pages to get started</p>
                </div>
            </div>
        </main>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">Processing...</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
